# NOTE: the arm is 5-DOF (j1-j5). KDL assumes 6-DOF, so full position+orientation
# pose goals will often fail IK. Joint-space goals always work; for Cartesian goals
# prefer position-only or approach from a reachable seed.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
