# MoveIt joint limits — velocities from the MG995 (8.05 rad/s no-load @6V).
# Accelerations are placeholders for trajectory time-parameterization (tune as needed).
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
